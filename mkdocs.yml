site_name: acwr
site_description: Acute:chronic workload ratios in Python, with the diagnostics to test whether they mean anything
site_url: https://lombergine.github.io/acwr/
repo_url: https://github.com/Lombergine/acwr
repo_name: Lombergine/acwr
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: { icon: material/weather-night, name: Switch to dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: { icon: material/weather-sunny, name: Switch to light mode }
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - toc.follow

nav:
  - Home: index.md
  - Getting started: example.md
  - Checking the metric: diagnostics.md
  - API reference: api.md
  - How this was built: ai-usage.md
  - Contributing: contributing.md
  - Changelog: changelog.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            show_source: true
            show_root_heading: true
            show_signature_annotations: true
            separate_signature: true
            members_order: source
            heading_level: 3

markdown_extensions:
  - admonition
  - toc: { permalink: true }
  - pymdownx.highlight: { anchor_linenums: true }
  - pymdownx.superfences
  - tables
  # The changelog, contributing guide and AI disclosure are transcluded from
  # the repository root rather than copied into docs/. A copy drifts, and the
  # published changelog had already drifted a full release behind.
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true

exclude_docs: |
  make_figure.py

watch:
  - src/acwr
